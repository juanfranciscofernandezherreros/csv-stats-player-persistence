name: cleanup-merged-branches

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged same-repository branches
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function deleteBranch(branch) {
              if (!branch || branch === 'main') return;
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`
                });
                core.info(`Deleted branch: ${branch}`);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.info(`Branch already absent or protected: ${branch}`);
                  return;
                }
                throw error;
              }
            }

            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              if (pr.merged && pr.head.repo?.full_name === `${owner}/${repo}`) {
                await deleteBranch(pr.head.ref);
              }
              return;
            }

            // A push to main also cleans any same-repository branches from
            // previously merged PRs, so installing this workflow removes stale branches.
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'closed',
              base: 'main',
              per_page: 100
            });

            for (const pr of pulls) {
              if (pr.merged_at && pr.head.repo?.full_name === `${owner}/${repo}`) {
                await deleteBranch(pr.head.ref);
              }
            }
